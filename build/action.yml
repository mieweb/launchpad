name: LaunchPad Build
description: Build the checked-out repository into a LaunchPad application image and push it to ghcr.io
author: mieweb

inputs:
  image:
    description: "Full image reference to build and push. Empty = ghcr.io/<owner>/<repo>/launchpad:<sha>. Must be pushable with the workflow's GITHUB_TOKEN (i.e., under ghcr.io/<owner>/)."
    required: false
    default: ""
  base_image:
    description: "Base image for the default Dockerfile (must be systemd-enabled and provide envsubst)"
    required: false
    default: "ghcr.io/mieweb/opensource-server/docker-nodejs:latest"
  working_directory:
    description: "Directory inside the image where the repository is copied"
    required: false
    default: "/workspace"
  dependency_command:
    description: "Lifecycle 1 (Dependencies): install third-party dependencies"
    required: false
    default: "npm ci --no-audit --no-fund"
  build_command:
    description: "Lifecycle 2+3 (Configure + Build): e.g. './configure && make'. Empty = skipped."
    required: false
    default: ""
  run_command:
    description: "Lifecycle 5 (Run): command app.service executes"
    required: false
    default: "npm start"

outputs:
  image:
    description: "The image reference that was built and pushed"
    value: ${{ steps.ref.outputs.image }}

runs:
  using: "composite"
  steps:
    - name: Validate Workspace
      shell: bash
      run: |
        if [ -z "$(ls -A "$GITHUB_WORKSPACE" 2>/dev/null)" ]; then
          echo "::error::Build mode requires actions/checkout before this action"
          exit 1
        fi

    - name: Resolve Image Reference
      id: ref
      shell: bash
      env:
        IMAGE_INPUT: ${{ inputs.image }}
      run: |
        if [ -n "$IMAGE_INPUT" ]; then
          IMAGE="$IMAGE_INPUT"
        else
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/launchpad:${GITHUB_SHA}"
        fi
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        echo "Image: $IMAGE"

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ github.action_path }}/Dockerfile
        build-contexts: |
          launchpad=${{ github.action_path }}
        push: true
        tags: ${{ steps.ref.outputs.image }}
        build-args: |
          BASE_IMAGE=${{ inputs.base_image }}
          WORKING_DIRECTORY=${{ inputs.working_directory }}
          DEPENDENCY_COMMAND=${{ inputs.dependency_command }}
          BUILD_COMMAND=${{ inputs.build_command }}
          RUN_COMMAND=${{ inputs.run_command }}
          REPO_URL=${{ github.server_url }}/${{ github.repository }}
        cache-from: type=gha,scope=launchpad-${{ github.ref_name }}
        cache-to: type=gha,scope=launchpad-${{ github.ref_name }},mode=max
